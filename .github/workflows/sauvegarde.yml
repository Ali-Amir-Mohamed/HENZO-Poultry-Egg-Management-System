# Sauvegarde quotidienne chiffrée de la base Supabase, envoyée vers un stockage de sauvegarde
# indépendant (Backblaze B2 ou Cloudflare R2, compatibles S3). GitHub ne fait que lancer la tâche.
#
# Secrets à créer dans GitHub > Settings > Secrets and variables > Actions :
#   SUPABASE_DB_URL       : chaîne de connexion « Session pooler » (Supabase > Connect)
#   BACKUP_PASSPHRASE     : mot de passe de chiffrement (à conserver précieusement, hors de l'ordinateur)
#   BACKUP_S3_ENDPOINT    : adresse du stockage (ex. https://s3.eu-central-003.backblazeb2.com)
#   BACKUP_S3_BUCKET      : nom du « bucket » (ex. henzo-sauvegardes)
#   BACKUP_S3_KEY_ID      : identifiant de la clé d'accès du stockage
#   BACKUP_S3_SECRET      : clé secrète du stockage
# Tant que le stockage n'est pas configuré, la sauvegarde reste en secours sur GitHub (30 jours).
# Restauration : voir docs/RESTAURATION.md
name: Sauvegarde quotidienne

on:
  schedule:
    - cron: '0 3 * * *'   # chaque jour à 3 h UTC (4 h au Cameroun)
  workflow_dispatch:       # bouton « Run workflow » pour une sauvegarde immédiate

permissions:
  contents: read

jobs:
  sauvegarde:
    runs-on: ubuntu-24.04   # version fixée : la procédure a été testée sur celle-ci
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      # Valeurs brutes : nettoyées (espaces, retours à la ligne collés par erreur) dans la 1re étape
      RAW_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      RAW_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      RAW_S3_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
      RAW_S3_SECRET: ${{ secrets.BACKUP_S3_SECRET }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Vérifier les secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Secrets SUPABASE_DB_URL et BACKUP_PASSPHRASE manquants (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          S3_ENDPOINT=$(clean "$RAW_S3_ENDPOINT"); S3_BUCKET=$(clean "$RAW_S3_BUCKET")
          KEY_ID=$(clean "$RAW_S3_KEY_ID"); SECRET=$(clean "$RAW_S3_SECRET")
          if [ -n "$S3_ENDPOINT" ] && [ -n "$S3_BUCKET" ] && [ -n "$KEY_ID" ] && [ -n "$SECRET" ]; then
            echo "::add-mask::$KEY_ID"
            echo "::add-mask::$SECRET"
            {
              echo "S3_ENDPOINT=$S3_ENDPOINT"
              echo "S3_BUCKET=$S3_BUCKET"
              echo "AWS_ACCESS_KEY_ID=$KEY_ID"
              echo "AWS_SECRET_ACCESS_KEY=$SECRET"
              echo "STOCKAGE=oui"
            } >> "$GITHUB_ENV"
            # Région : Backblaze l'exige dans la signature (ex. us-east-005, lue dans l'adresse) ; R2 utilise « auto »
            REGION=$(echo "$S3_ENDPOINT" | sed -n 's#^\(https://\)\{0,1\}s3\.\([a-z0-9-]*\)\.backblazeb2\.com.*#\2#p')
            echo "AWS_DEFAULT_REGION=${REGION:-auto}" >> "$GITHUB_ENV"
            echo "Région du stockage : ${REGION:-auto}"
            case "$S3_ENDPOINT" in https://*) ;; *) echo "::error::BACKUP_S3_ENDPOINT doit commencer par https://"; exit 1 ;; esac
          else
            echo "::warning::Stockage de sauvegarde pas encore configuré : copie de secours gardée 30 jours sur GitHub."
            echo "STOCKAGE=non" >> "$GITHUB_ENV"
          fi

      - name: Installer le client PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Exporter et chiffrer
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          BIN=/usr/lib/postgresql/17/bin
          mkdir sauvegarde
          # Toutes les données et la structure de l'application
          $BIN/pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges -Fc -f sauvegarde/henzo-public.dump
          # Les comptes (identifiants, mots de passe chiffrés) pour pouvoir les recréer
          $BIN/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "\copy (select id, email, encrypted_password, email_confirmed_at, raw_user_meta_data, created_at from auth.users) to 'sauvegarde/comptes.csv' csv header"
          tar czf henzo.tar.gz sauvegarde
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "henzo-$STAMP.tar.gz.gpg" henzo.tar.gz
          rm -rf sauvegarde henzo.tar.gz
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          ls -lh henzo-*.gpg

      - name: Envoyer vers le stockage de sauvegarde
        if: env.STOCKAGE == 'oui'
        run: |
          set -euo pipefail
          # Test d'accès d'abord, avec un message clair en cas de clé ou de bucket incorrect
          if ! aws s3api head-bucket --bucket "$S3_BUCKET" --endpoint-url "$S3_ENDPOINT" 2> erreur.txt; then
            echo "::error::Accès au stockage refusé. Vérifiez BACKUP_S3_KEY_ID / BACKUP_S3_SECRET (clé Read and Write sur ce bucket), BACKUP_S3_BUCKET et BACKUP_S3_ENDPOINT."
            sed -E 's/[A-Za-z0-9+\/]{30,}/***/g' erreur.txt
            exit 1
          fi
          aws s3 cp "henzo-$STAMP.tar.gz.gpg" "s3://$S3_BUCKET/quotidien/henzo-$STAMP.tar.gz.gpg" --endpoint-url "$S3_ENDPOINT"
          # Le 1er du mois : une copie mensuelle, gardée un an
          if [ "$(date -u +%d)" = "01" ]; then
            aws s3 cp "henzo-$STAMP.tar.gz.gpg" "s3://$S3_BUCKET/mensuel/henzo-$STAMP.tar.gz.gpg" --endpoint-url "$S3_ENDPOINT"
          fi
          # Vérification : le fichier est bien arrivé, avec la bonne taille
          LOCAL=$(stat -c %s "henzo-$STAMP.tar.gz.gpg")
          DISTANT=$(aws s3api head-object --bucket "$S3_BUCKET" --key "quotidien/henzo-$STAMP.tar.gz.gpg" --endpoint-url "$S3_ENDPOINT" --query ContentLength --output text)
          [ "$LOCAL" = "$DISTANT" ] || { echo "::error::Taille différente après envoi ($LOCAL / $DISTANT)"; exit 1; }
          echo "Sauvegarde envoyée et vérifiée : $LOCAL octets"

      - name: Supprimer les anciennes sauvegardes (quotidiennes > 30 jours, mensuelles > 365 jours)
        if: env.STOCKAGE == 'oui'
        run: |
          set -euo pipefail
          purge() {
            LIMITE=$(date -u -d "-$2 days" +%Y-%m-%d)
            aws s3 ls "s3://$S3_BUCKET/$1/" --endpoint-url "$S3_ENDPOINT" | awk '{print $4}' | while read -r f; do
              D=$(echo "$f" | sed -n 's/^henzo-\([0-9-]\{10\}\)\.tar\.gz\.gpg$/\1/p')
              if [ -n "$D" ] && [[ "$D" < "$LIMITE" ]]; then
                echo "Suppression $1/$f"
                aws s3 rm "s3://$S3_BUCKET/$1/$f" --endpoint-url "$S3_ENDPOINT"
              fi
            done
          }
          purge quotidien 30
          purge mensuel 365

      - name: Copie de secours sur GitHub (seulement sans stockage configuré)
        if: env.STOCKAGE != 'oui'
        uses: actions/upload-artifact@v4
        with:
          name: henzo-sauvegarde-${{ env.STAMP }}
          path: henzo-*.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
