# Sauvegarde hebdomadaire chiffrée de la base Supabase.
# Secrets à créer dans GitHub > Settings > Secrets and variables > Actions :
#   SUPABASE_DB_URL    : chaîne de connexion « Session pooler » (Supabase > Connect)
#   BACKUP_PASSPHRASE  : mot de passe de chiffrement (à conserver précieusement)
# Restauration : voir docs/RESTAURATION.md
name: Sauvegarde hebdomadaire

on:
  schedule:
    - cron: '0 3 * * 0'   # chaque dimanche à 3 h UTC (4 h au Cameroun)
  workflow_dispatch:       # bouton « Run workflow » pour une sauvegarde immédiate

permissions:
  contents: read

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Vérifier les secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Secrets SUPABASE_DB_URL et BACKUP_PASSPHRASE manquants (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Installer le client PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Exporter et chiffrer
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          BIN=/usr/lib/postgresql/17/bin
          mkdir sauvegarde
          # Toutes les données et la structure de l'application
          $BIN/pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges -Fc -f sauvegarde/henzo-public.dump
          # Les comptes (identifiants, mots de passe chiffrés) pour pouvoir les recréer
          $BIN/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "\copy (select id, email, encrypted_password, email_confirmed_at, raw_user_meta_data, created_at from auth.users) to 'sauvegarde/comptes.csv' csv header"
          tar czf henzo.tar.gz sauvegarde
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "henzo-$STAMP.tar.gz.gpg" henzo.tar.gz
          rm -rf sauvegarde henzo.tar.gz
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          ls -lh henzo-*.gpg

      - name: Conserver la sauvegarde (90 jours)
        uses: actions/upload-artifact@v4
        with:
          name: henzo-sauvegarde-${{ env.STAMP }}
          path: henzo-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
